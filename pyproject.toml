[project]
name = "docquery"
version = "0.1.0"
description = "Production RAG system for querying technical documentation"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]",
    "pydantic-settings",
    "sentence-transformers",
    "qdrant-client",
    "openai",
    "langchain-text-splitters",
    "pypdf",
    "torch",
    # Pulled in transitively by docling. Declared here so the CPU-index routing
    # in [tool.uv.sources] applies to it, and pinned to the release that matches
    # the locked torch — a mismatched pair fails at import with
    # "operator torchvision::nms does not exist".
    "torchvision==0.26.0",
    "docling==2.120.1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "ruff",
]
eval = [
    "ragas",
    "langchain-openai",
]
chunking = [
    "langchain-experimental",
]
security = [
    "deepeval",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docquery"]

[tool.fastapi]
entrypoint = "docquery.api.app:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
# docling pulls torchvision in transitively. It must come from the same index
# as torch: the PyPI build is compiled against a different torch and fails at
# import with "operator torchvision::nms does not exist".
torchvision = { index = "pytorch-cpu" }

[tool.ruff]
src = ["src"]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "FAST"]
